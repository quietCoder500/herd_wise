upstream django_app {
    server web:8000;
}

server {
    listen 80;
    # You can put your server's local LAN IP here, or leave it as _ to catch all traffic
    server_name _; 

    # Max upload size
    client_max_body_size 20M;

    # Serve static files
    location /static/ {
        alias /app/staticfiles/;
    }

    # Serve media files
    location /media/ {
        alias /app/mediafiles/;
    }

    # Pass all traffic to the Django application container
    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }
}