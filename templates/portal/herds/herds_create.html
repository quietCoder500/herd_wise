{% extends 'portal/layout.html' %}

{% block title %}
HW - Create a herd
{% endblock title %}

{% block content %}
<div class="mx-auto max-w-3xl py-6">
    <div class="card bg-base-100 shadow-sm">
        <div class="card-body">
            <div class="mb-3">
                <div class="badge badge-primary badge-outline mb-3">New herd</div>
                <h1 class="text-3xl font-bold text-primary">Create a herd</h1>
                <p class="mt-2 text-sm text-base-content/70">Create a new group for your animals within this farm.</p>
            </div>

            <form class="space-y-4" method="post" action="{% url 'portal:herds_create_view' slug=farm_slug %}">
                {% csrf_token %}
                <div class="rounded-box bg-base-200 p-4">
                    {% include '_components/_standard_form.html' %}
                </div>
                <div class="flex flex-wrap gap-3">
                    <button type="submit" class="btn btn-primary">Create herd</button>
                    <a href="{% url 'portal:herds_list_view' slug=farm_slug %}" class="btn btn-ghost">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
