{% extends 'portal/layout.html' %}

{% block title %}
HW - Edit Herd
{% endblock title %}

{% block content %}
<div class="mx-auto max-w-3xl py-6">
    <div class="card bg-base-100 shadow-sm">
        <div class="card-body">
            <div class="mb-3">
                <div class="badge badge-secondary badge-outline mb-3">Herd details</div>
                <h1 class="text-3xl font-bold text-primary">Edit {{ herd.name }}</h1>
                <p class="mt-2 text-sm text-base-content/70">Adjust the herd identity and naming setup here.</p>
            </div>

            <form class="space-y-4" method="post" action="{% url 'portal:herds_detail_view' slug=herd.slug %}">
                {% csrf_token %}
                <div class="rounded-box bg-base-200 p-4">
                    {% include '_components/_standard_form.html' %}
                </div>
                <div class="flex flex-wrap gap-3">
                    <button type="submit" class="btn btn-primary">Save herd</button>
                    <a href="{% url 'portal:herds_list_view' slug=herd.farm.slug %}" class="btn btn-ghost">Back
                        to herds</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
