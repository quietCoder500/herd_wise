{% extends 'portal/layout.html' %}

{% block title %}
HW - My Farms
{% endblock title %}

{% block content %}
<div>
    <h2 class="text-3xl text-primary">My Farms</h2>
    <ul class="m-12 space-y-4">
        {% for farm in farms %}
        <li>
            <a href="{% url 'portal:farms_detail_view' public_id=farm.public_id %}" class="btn">
                {{ farm.name }}
            </a>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock content %}
