{% extends 'portal/layout.html' %}

{% block title %}
HW - Add Multiple Animals
{% endblock title %}

{% block content %}
<div class="flex flex-col gap-4">
    <h2 class="text-3xl text-primary">Add Multiple Animals</h2>
    <form class="flex flex-col gap-4" method="post"
        action="{% url 'portal:animals_mass_create_view' herd_pub_id=herd_pub_id %}">
        {% csrf_token %}
        {% include '_components/_standard_form.html' %}
    </form>
</div>
{% endblock content %}
