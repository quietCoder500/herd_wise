{% extends 'base_layout.html' %}

{% block body %}
<nav class="navbar bg-base-100 shadow-lg flex justify-between items-center">
    <a href="/" class="btn btn-ghost text-xl font-bold text-primary">Herd Wise</a>
    <div class="flex gap-2 items-center">
        {% if user.is_authenticated %}
        <a href="/accounts/profile" class="btn btn-ghost">Profile</a>
        <a href="/accounts/logout" class="btn btn-ghost">Logout</a>
        {% else %}
        <a href="/accounts/login" class="btn btn-ghost">Login</a>
        <a href="/accounts/signup" class="btn btn-ghost">Register</a>
        {% endif %}
        {% include "_components/_theme_selector.html" %}
    </div>
</nav>
{% block content %}{% endblock content %}
{% endblock body %}
