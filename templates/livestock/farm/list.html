{% extends 'livestock/layout.html' %}

/* This page will have:
- a header from layout
- A welcome for the user
- a list of links to other farms
*/

{% block content %}
<h2 class="text-5xl ml-12 m-4 text-secondary font-mono">
    Hi, {{ user.username }}
</h2>
<main class="m-2">
    <ul class="list rounded-2xl m-4 bg-base-200">
        {% for farm in farms %}
        <li class="list-row rounded-none">
            <a class="" href="/livestock/farm/{{ farm.public_id }}/">
                <h4 class="text-2xl text-primary font-semibold">
                    {{ farm.name }}
                <h4/>
                <span>
                    <i class="fa-solid fa-location-dot text-accent"></i>
                </span>

            </a>
        </li>
        {% endfor %}
    </ul>
</main>
{% endblock content %}
