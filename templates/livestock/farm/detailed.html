{% extends 'livestock/layout.html' %}

/* This is next to work on */

{% block content %}
    <main class="mx-12">
        <h2 class="text-6xl text-accent font-mono">{{ farm.name }}</h2>
        {% if farm.location %}
            <p class="text-2xl text-secondary mb-2">{{ farm.location }}</p>
        {% endif %}
        <a class="btn btn-primary my-4" href="/livestock/animal_groups/{{ farm.public_id }}">
            See all animal groups in this farm
            <i class="fa-solid fa-angles-right m-auto"></i>
        </a>
    </main>
{% endblock content %}
