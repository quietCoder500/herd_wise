{% extends 'livestock/layout.html' %}

{% block content %}
    <main class="ml-12 flex flex-col">
        <h2 class="text-6xl font-mono text-accent">{{ farm.name }}</h2>
        <p class="mb-2 text-2xl text-secondary">
            {{ animal_groups|length }} {{ animal_groups|length|pluralize:"group,groups" }}
        </p>
        <ul class="list rounded-2xl my-4 bg-base-200 shadow-2xl">
            {% for animal_group in animal_groups %}
                <li class="list-row rounded-none">
                    <a class="flex flex-row items-center" href="/livestock/animal_group/{{ animal_group.public_id }}/">
                        <i class="fa-solid fa-minus text-primary my-auto mr-2"></i>
                        <h4 class="text-2xl text-primary align-middle">
                            {{ animal_group.name }}
                        </h4>
                    </a>
                </li>
            {% endfor %}
        </ul>
    </main>
{% endblock content %}
